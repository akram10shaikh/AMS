{% extends "player_app/organization/base.html" %}
{% load static %}

{% block title %}Add Bowler Drills{% endblock %}

{% block extra_head %}
<style>
    .form-page { max-width: 1000px; margin: 0 auto; padding: 1rem; }
    .page-header { margin-bottom: 2rem; }
    .page-title { 
        font-size: 1.5rem; 
        font-weight: 600; 
        color: #000000 !important;
        margin: 0 0 0.5rem 0; 
    }
    .page-subtitle { 
        color: #94a3b8 !important;
        font-size: 0.95rem; 
        margin: 0; 
    }
    
    .btn-secondary {
        background: #475569;
        color: #f1f5f9;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        text-decoration: none;
        transition: all 0.2s;
        border: 1px solid #475569;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-weight: 500;
        margin-bottom: 1rem;
    }
    
    .btn-secondary:hover {
        background: #334155;
        transform: translateY(-1px);
        color: #f1f5f9;
        text-decoration: none;
    }
    
    .material-icons {
        font-size: 1.1rem;
        font-weight: 400;
    }
    
    .mb-4 {
        margin-bottom: 1rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="form-page">
  <div class="page-header">
    <h1 class="page-title"> Add Bowler Drills</h1>
    <p class="page-subtitle">Add bowling data for player or camps and tournaments</p>

  </div>
  <a href="{% url 'individual_test_data' %}" class="btn-secondary mb-4">
    Individual Test Data
  </a>
<a href="{% url 'camp_test_data' %}" class="btn-secondary mb-4">
    Camp Test Data
  </a>
</div>

{% endblock %}
